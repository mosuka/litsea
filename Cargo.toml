[workspace]
resolver = "3"
members = ["litsea", "litsea-cli", "litsea-binding-core", "litsea-python"]
# The language bindings are members (so `cargo clippy --workspace` covers
# them) but not default members: the six-platform regression matrix would
# otherwise build a Python extension module on runners with no Python
# development environment. Each binding gets its own CI job instead.
default-members = ["litsea", "litsea-cli", "litsea-binding-core"]

# CPU-bound hot loops (feature-template scoring per character) benefit from
# cross-codegen-unit inlining; thin LTO + a single codegen unit trades
# release compile time for runtime performance (#105). `panic = "abort"` was
# considered and rejected: it cannot be scoped to the CLI binary alone and
# would complicate release-profile tests/benches that require unwinding.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.12.0"
edition = "2024"
rust-version = "1.87"
description = "Litsea is an extremely compact word segmentation and model training tool implemented in Rust."
documentation = "https://docs.rs/litsea"
homepage = "https://github.com/mosuka/litsea"
repository = "https://github.com/mosuka/litsea"
readme = "README.md"
keywords = ["word", "segmentation", "training", "model", "nlp"]
categories = ["text-processing"]
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
reqwest = { version = "0.13.4", features = [
    "rustls",
], default-features = false } # use rustls instead of native-tls to avoid linking openssl; disables http2, charset, and system-proxy
rustc-hash = "2.1.3"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-test = "0.4.5"
criterion = { version = "0.8.2", default-features = false, features = [
    "html_reports",
] }

litsea = { version = "0.12.0", path = "./litsea" }
litsea-binding-core = { version = "0.12.0", path = "./litsea-binding-core" }
