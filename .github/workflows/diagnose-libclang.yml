# Temporary diagnosis for #299 on the ubuntu-latest (Ubuntu 26.04) runner:
# which libclang and which clang the build scripts of ext-php-rs and rb-sys
# use, whether a matching pair generates the bindings, and whether Ruby 3.1
# installs. It runs only on pushes to the fix branch and is removed before the
# fix is reviewed.
name: Diagnose libclang

on:
  push:
    branches:
      - fix/ci-unpin-ubuntu-2604

permissions:
  contents: read

jobs:
  diagnose-php:
    name: Diagnose libclang for ext-php-rs
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # The newest PHP of the Test litsea-php job.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Diagnose
        run: bash scripts/diagnose-libclang.sh ext-php-rs

      # The fix: the action sets CLANG_PATH and LIBCLANG_PATH for the next
      # steps, which build ext-php-rs with the pair it chose.
      - name: Pair libclang with clang
        uses: ./.github/actions/setup-libclang

      - name: Build ext-php-rs with the pair
        run: |
          echo "CLANG_PATH=${CLANG_PATH} LIBCLANG_PATH=${LIBCLANG_PATH}"
          CARGO_TARGET_DIR=/tmp/diag-target-action cargo build --locked -p ext-php-rs
          echo "ACTION_PAIR_BUILD_OK ext-php-rs"

  diagnose-ruby:
    name: Diagnose libclang for rb-sys (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Ruby versions of the Test litsea-ruby job.
        ruby-version: ["3.1", "3.3", "3.4"]
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Diagnose
        run: bash scripts/diagnose-libclang.sh rb-sys

      - name: Pair libclang with clang
        uses: ./.github/actions/setup-libclang

      - name: Build rb-sys with the pair
        run: |
          echo "CLANG_PATH=${CLANG_PATH} LIBCLANG_PATH=${LIBCLANG_PATH}"
          CARGO_TARGET_DIR=/tmp/diag-target-action cargo build --locked -p rb-sys
          echo "ACTION_PAIR_BUILD_OK rb-sys"
