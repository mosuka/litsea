name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  format:
    name: Format
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Run format
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    needs: [format]
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            skip_test_run: true
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run test
        shell: bash
        run: |
          if [ "${{ matrix.platform.skip_test_run }}" == "true" ]; then
            cargo check --target "${{ matrix.platform.target }}" --all-features
          else
            cargo test --target "${{ matrix.platform.target }}" --all-features
          fi

  test-litsea-python:
    name: Test litsea-python
    needs: [format]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-python-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python test
        # Builds the extension with maturin, then runs pytest. The parity
        # tests build and invoke the CLI themselves, so they compare against
        # the reference implementation rather than hardcoded expectations.
        run: make test-litsea-python

      - name: Run Python lint
        run: make lint-litsea-python

  test-litsea-nodejs:
    name: Test litsea-nodejs
    needs: [format]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-nodejs-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Node.js test
        run: make test-litsea-nodejs

      - name: Run Node.js lint
        run: make lint-litsea-nodejs

      - name: Verify generated entry points are up to date
        # `napi build` regenerates index.js / index.d.ts; they are committed,
        # so a diff here means someone changed the API - or bumped the pinned
        # @napi-rs/cli, whose templates produce them - without rebuilding.
        run: git diff --exit-code litsea-nodejs/index.js litsea-nodejs/index.d.ts

  test-litsea-php:
    name: Test litsea-php
    needs: [format]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.3", "8.5"]
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-php${{ matrix.php-version }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Run PHP test
        run: make test-litsea-php

      - name: Run PHP lint
        run: make lint-litsea-php

  test-litsea-ruby:
    name: Test litsea-ruby
    needs: [format]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["3.1", "3.3", "3.4"]
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ruby${{ matrix.ruby-version }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}

      - name: Run Ruby test
        run: make test-litsea-ruby

      - name: Run Ruby lint
        run: make lint-litsea-ruby

  test-litsea-wasm:
    name: Test litsea-wasm
    needs: [format]
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Run wasm test
        # Headless Firefox; the fixtures are generated from the CLI first, so
        # the browser tests compare against the reference implementation.
        run: make test-litsea-wasm

      - name: Run wasm lint
        run: make lint-litsea-wasm

      - name: Verify the CLI fixtures are up to date
        # `make test-litsea-wasm` regenerates them; a diff means the CLI's
        # output changed (a retrained model, say) without the committed
        # expectation being refreshed.
        run: git diff --exit-code litsea-wasm/tests/fixtures.tsv

  create-release:
    name: Create Release
    needs:
      [
        test,
        test-litsea-python,
        test-litsea-nodejs,
        test-litsea-php,
        test-litsea-ruby,
        test-litsea-wasm,
      ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          # The bundled models, attached uncompressed and individually so
          # each has a stable download URL: `litsea segment -m <url>` (with
          # the `remote_model` feature) and the WebAssembly binding's
          # fetch-then-`fromBytes` flow can point straight at one, and a
          # caller downloads only the language they need rather than 24 MB.
          # Listed explicitly rather than globbed, so the legacy
          # RWCP / JEITA compatibility models stay out.
          files: |
            models/chinese.model
            models/chinese_pos.model
            models/english.model
            models/english_pos.model
            models/japanese.model
            models/japanese_pos.model
            models/korean.model
            models/korean_pos.model

  release:
    name: Build
    needs: [test, create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: .zip
            extension: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: .zip
            extension: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: .zip
            extension: ""
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            archive: .zip
            extension: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: .zip
            extension: .exe
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            archive: .zip
            extension: .exe
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Cache ~/.cargo/registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache ~/.cargo/git
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.platform.target }}

      - name: Add msbuild to PATH
        if: matrix.platform.runner == 'windows-latest'
        uses: microsoft/setup-msbuild@v3

      - name: Compile
        run: cargo build --release --target=${{ matrix.platform.target }}

      - name: Create artifact for Linux
        if: runner.os == 'Linux'
        run: zip --junk-paths litsea-${{ matrix.platform.target }}-${{ github.ref_name }}${{ matrix.platform.archive }} target/${{ matrix.platform.target }}/release/litsea${{ matrix.platform.extension }}

      - name: Create artifact for Windows
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -DestinationPath litsea-${{ matrix.platform.target }}-${{ github.ref_name }}${{ matrix.platform.archive }} -Path target/${{ matrix.platform.target }}/release/litsea${{ matrix.platform.extension }}

      - name: Create artifact for OSX
        if: runner.os == 'macOS'
        run: zip --junk-paths litsea-${{ matrix.platform.target }}-${{ github.ref_name }}${{ matrix.platform.archive }} target/${{ matrix.platform.target }}/release/litsea${{ matrix.platform.extension }}

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: litsea-${{ matrix.platform.target }}-${{ github.ref_name }}${{ matrix.platform.archive }}
          tag_name: ${{ github.ref_name }}

  build-php-binaries:
    name: Build PIE binary (php${{ matrix.php-version }}-${{ matrix.platform.arch }}-${{ matrix.platform.os }}-${{ matrix.ts }})
    needs: [test-litsea-php, create-release]
    # Runs after the release exists on a tag push, and as a dry run on
    # workflow_dispatch from a branch. create-release is tag-gated and ends
    # up `skipped` on a dispatch, which the implicit success() would treat
    # as a failure, hence the explicit result checks. The zips are always
    # uploaded as workflow artifacts and attached to the GitHub Release only
    # on a tag (last step).
    if: ${{ !cancelled() && needs.test-litsea-php.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.create-release.result) }}
    strategy:
      # A dry run should report every cell rather than stop at the first
      # failure.
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        ts: [nts, zts]
        platform:
          # arch / os / libc are the segments PIE puts in the asset name
          # (php/pie src/Platform/{Architecture,OperatingSystemFamily,LibcFlavour}.php).
          # macOS is always "bsdlibc" because PIE detects otool, and only
          # Apple silicon is built: setup-php has deprecated the Intel
          # runners and can no longer install PHP on them, so Intel Macs
          # fall back to PIE's source build. Linux is built on 22.04 so the
          # module needs no GLIBC symbol newer than 2.35 and loads on
          # Ubuntu 22.04 and Debian 12.
          - runner: ubuntu-22.04
            arch: x86_64
            os: linux
            libc: glibc
          - runner: ubuntu-22.04-arm
            arch: arm64
            os: linux
            libc: glibc
          - runner: macos-latest
            arch: arm64
            os: darwin
            libc: bsdlibc
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
        env:
          phpts: ${{ matrix.ts }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        # Registry and index only: ext-php-rs bakes the target PHP's headers
        # into the build, so a `target` cache would need one entry per cell
        # and evict everything else under the repository cache cap.
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-pie-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install a matching clang and libclang (Linux x86_64)
        # bindgen loads the newest libclang it can find but asks the `clang`
        # driver on PATH for the system include paths. The 22.04 image ships
        # clang 14 on PATH next to libclang 15, so clang 14's emmintrin.h is
        # parsed by a different libclang and the SSE builtins mismatch
        # ("invalid conversion between vector type '__m128i' ... and integer
        # type 'int'"). One LLVM 18 for both sides fixes it; arm64 has no
        # SSE headers and builds with the stock toolchain.
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"
          echo "CLANG_PATH=/usr/lib/llvm-18/bin/clang" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v autoconf >/dev/null || brew install autoconf
          command -v glibtoolize >/dev/null || brew install libtool

      - name: Build through phpize (the path PIE runs)
        working-directory: litsea-php
        run: |
          phpize
          ./configure --with-php-config="$(command -v php-config)"
          make LITSEA_CARGO_FLAGS=--locked
          test -f modules/litsea.so

      - name: Verify the module loads and matches the release version
        working-directory: litsea-php
        run: |
          php -n -d extension="$PWD/modules/litsea.so" -m | grep -x litsea
          expected=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "litsea-php") | .version')
          actual=$(php -n -d extension="$PWD/modules/litsea.so" -r 'echo Litsea\version();')
          # PHP_ZTS is an int up to 8.3 and a bool from 8.4, where `echo`
          # prints "" for false; the ternary gives one spelling for both.
          ts=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          echo "extension reports $actual, Cargo says $expected, PHP is $ts"
          test "$actual" = "$expected"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$expected" = "$GITHUB_REF_NAME"
          fi
          test "$ts" = "${{ matrix.ts }}"

      - name: Verify the glibc requirement (Linux)
        if: runner.os == 'Linux'
        working-directory: litsea-php
        run: |
          objdump -p modules/litsea.so | awk '/NEEDED/ {print $2}'
          if objdump -p modules/litsea.so | awk '/NEEDED/ {print $2}' | grep -v -E '^(libc|libm|libgcc_s|libpthread|libdl|librt|ld-linux)'; then
            echo "error: unexpected shared-library dependency" >&2
            exit 1
          fi
          max=$(objdump -T modules/litsea.so | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1)
          echo "highest GLIBC symbol version: $max"
          test "$(printf '%s\n' "${max#GLIBC_}" 2.35 | sort -V | tail -1)" = 2.35

      - name: Verify the dynamic dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: litsea-php
        run: |
          otool -L modules/litsea.so
          if otool -L modules/litsea.so | tail -n +2 | grep -E '/opt/homebrew/|/usr/local/'; then
            echo "error: linked against a Homebrew library that users need not have" >&2
            exit 1
          fi

      - name: Package the pre-packaged binary for PIE
        id: package
        working-directory: litsea-php
        run: |
          # PIE looks up php_{ext}-{version}_php{X.Y}-{arch}-{os}-{libc}-{nts|zts}.zip
          # on the release for {version} = Composer's pretty version = the
          # git tag (php/pie src/Platform/PrePackagedBinaryAssetName.php),
          # and expects litsea.so at the archive root. A branch dry run has
          # no tag; it uses the Cargo version with a -dev marker.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="v$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "litsea-php") | .version')-dev"
          fi
          php_minor=$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')
          ts=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          asset=$(echo "php_litsea-${version}_php${php_minor}-${{ matrix.platform.arch }}-${{ matrix.platform.os }}-${{ matrix.platform.libc }}-${ts}.zip" | tr '[:upper:]' '[:lower:]')
          zip -j "$asset" modules/litsea.so
          unzip -l "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: pie-${{ matrix.platform.runner }}-php${{ matrix.php-version }}-${{ matrix.ts }}
          path: litsea-php/${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: litsea-php/${{ steps.package.outputs.asset }}
          tag_name: ${{ github.ref_name }}

  publish-crates:
    name: Publish crate
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
        toolchain: [stable]
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Publish litsea
        run: |
          LITSEA_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="litsea") | .version')
          LITSEA_VERSIONS=$(curl -s -XGET https://crates.io/api/v1/crates/litsea | jq -r 'select(.versions != null) | .versions[].num' 2>/dev/null)
          if echo "${LITSEA_VERSIONS}" | tr ' ' '\n' | grep -qFx "${LITSEA_VERSION}"; then
            echo "litsea ${LITSEA_VERSION} has already been published"
          else
            pushd litsea
            cargo publish
            popd
          fi
          sleep 20
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Publish litsea-binding-core
        run: |
          LITSEA_BINDING_CORE_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="litsea-binding-core") | .version')
          LITSEA_BINDING_CORE_VERSIONS=$(curl -s -XGET https://crates.io/api/v1/crates/litsea-binding-core | jq -r 'select(.versions != null) | .versions[].num' 2>/dev/null)
          if echo "${LITSEA_BINDING_CORE_VERSIONS}" | tr ' ' '\n' | grep -qFx "${LITSEA_BINDING_CORE_VERSION}"; then
            echo "litsea-binding-core ${LITSEA_BINDING_CORE_VERSION} has already been published"
          else
            pushd litsea-binding-core
            cargo publish
            popd
          fi
          sleep 20
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

      - name: Publish litsea-cli
        run: |
          LITSEA_CLI_VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name=="litsea-cli") | .version')
          LITSEA_CLI_VERSIONS=$(curl -s -XGET https://crates.io/api/v1/crates/litsea-cli | jq -r 'select(.versions != null) | .versions[].num' 2>/dev/null)
          if echo "${LITSEA_CLI_VERSIONS}" | tr ' ' '\n' | grep -qFx "${LITSEA_CLI_VERSION}"; then
            echo "litsea-cli ${LITSEA_CLI_VERSION} has already been published"
          else
            pushd litsea-cli
            cargo publish
            popd
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  build-python-wheels:
    name: Build wheel (${{ matrix.platform.target }})
    needs: [test-litsea-python]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: auto
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
          - runner: macos-latest
            target: aarch64
          - runner: macos-26-intel
            target: x86_64
          - runner: windows-latest
            target: x64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Build wheel
        # abi3-py310, so one wheel per platform covers every supported
        # Python version.
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --manifest-path litsea-python/Cargo.toml
          sccache: "true"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  publish-python:
    name: Publish litsea to PyPI
    needs: [build-python-wheels, publish-crates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        # Requires the PYPI_TOKEN repository secret; until it is set this
        # step fails and the rest of the release is unaffected.
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

  build-nodejs-binaries:
    name: Build addon (${{ matrix.platform.target }})
    needs: [test-litsea-nodejs]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.platform.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build addon
        working-directory: litsea-nodejs
        run: |
          npm install --no-audit --no-fund
          npx napi build --platform --release --target ${{ matrix.platform.target }} -p litsea-nodejs

      - name: Upload addon
        uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.platform.target }}
          path: litsea-nodejs/*.node

  publish-nodejs:
    name: Publish litsea to npm
    needs: [build-nodejs-binaries, publish-crates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download addons
        uses: actions/download-artifact@v8
        with:
          pattern: addon-*
          merge-multiple: true
          path: litsea-nodejs/artifacts

      - name: Publish to npm
        # Requires the NPM_TOKEN repository secret; until it is set this step
        # fails and the rest of the release is unaffected.
        working-directory: litsea-nodejs
        run: |
          npm install --no-audit --no-fund
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts
          npx napi prepublish --no-gh-release
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-ruby:
    name: Publish litsea to RubyGems
    needs: [test-litsea-ruby, publish-crates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Build gem
        working-directory: litsea-ruby
        run: |
          bundle install
          bundle exec rake build

      - name: Publish to RubyGems
        # Requires the RUBYGEMS_API_KEY repository secret; until it is set
        # this step fails and the rest of the release is unaffected. The gem
        # is source-only, so it compiles on the user's machine at install
        # time.
        working-directory: litsea-ruby
        run: |
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "${RUBYGEMS_API_KEY}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push pkg/litsea-*.gem
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

  publish-wasm:
    name: Publish litsea-wasm to npm
    needs: [test-litsea-wasm, publish-crates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Run checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Build package
        run: make build-litsea-wasm

      - name: Publish to npm
        # Reuses the NPM_TOKEN secret the Node.js binding needs; the package
        # name differs (litsea-wasm vs litsea), so both can publish.
        working-directory: litsea-wasm/pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
